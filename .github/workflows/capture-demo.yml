name: Capture demo screenshots

on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/app/features/control-room/**'
      - '.github/scripts/capture-control-room.cjs'
      - '.github/workflows/capture-demo.yml'
  workflow_dispatch:
    inputs:
      control_room_only:
        description: Validate and capture Control Room 3D with live demo records
        type: boolean
        default: false
    inputs:
      warehouse_only:
        description: Capture and validate Warehouse Twin with real demo records
        type: boolean
        default: false
      world_map_only:
        description: Validar y capturar únicamente World Map 3D
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: capture-demo
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - name: Install isolated capture tools
        run: |
          npm install --prefix "$RUNNER_TEMP/capture-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/capture-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Prepare ephemeral demo environment
        shell: bash
        run: |
          DB_PASSWORD=$(openssl rand -hex 24)
          SIGNING_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$SIGNING_SECRET"
          umask 077
          {
            echo 'POSTGRES_DB=mazmi_capture'
            echo 'POSTGRES_USER=mazmi_capture'
            echo "POSTGRES_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$SIGNING_SECRET"
            echo 'SPRING_PROFILES_ACTIVE=demo'
            echo 'DEMO_ENABLED=true'
            echo 'COOKIE_SECURE=false'
            echo 'ALLOWED_ORIGIN=http://localhost:4200'
            echo 'SWAGGER_ENABLED=true'
          } > "$RUNNER_TEMP/capture.env"
      - name: Build and start the full application
        run: docker compose --env-file "$RUNNER_TEMP/capture.env" -p mazmi-capture up --build --detach --wait --wait-timeout 240
      - name: Capture desktop and verify mobile
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.warehouse_only && !inputs.world_map_only && !inputs.control_room_only }}
        env:
          NODE_PATH: ${{ runner.temp }}/capture-tools/node_modules
          CAPTURE_DIR: ${{ runner.temp }}/portfolio-screenshots
        run: node .github/scripts/capture-demo.cjs
      - name: Validate and capture Warehouse Twin
        if: ${{ inputs.warehouse_only && !inputs.control_room_only }}
        env:
          NODE_PATH: ${{ runner.temp }}/capture-tools/node_modules
          CAPTURE_DIR: ${{ runner.temp }}/portfolio-screenshots
        run: node .github/scripts/capture-warehouse.cjs
      - name: Validate and capture World Map
        if: ${{ inputs.world_map_only && !inputs.control_room_only }}
        env:
          NODE_PATH: ${{ runner.temp }}/capture-tools/node_modules
          CAPTURE_DIR: ${{ runner.temp }}/portfolio-screenshots
        run: node .github/scripts/capture-world-map.cjs
      - name: Validate and capture Control Room 3D
        if: ${{ github.event_name == 'push' || inputs.control_room_only }}
        env:
          NODE_PATH: ${{ runner.temp }}/capture-tools/node_modules
          CAPTURE_DIR: ${{ runner.temp }}/portfolio-screenshots
        run: node .github/scripts/capture-control-room.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portfolio-screenshots
          path: ${{ runner.temp }}/portfolio-screenshots/
          if-no-files-found: error
          retention-days: 7
      - name: Service diagnostics on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/capture.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/capture.env" -p mazmi-capture logs --no-color --tail 100
          fi
      - name: Stop temporary services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/capture.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/capture.env" -p mazmi-capture down --volumes --remove-orphans
          fi
