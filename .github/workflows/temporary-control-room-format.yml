name: Control Room formatter (temporary)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: contains(github.event.head_commit.message, 'chore: preparar formateo de Control Room')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Format and print resulting files
        shell: bash
        run: |
          cd frontend
          ./node_modules/.bin/prettier --write \
            src/app/features/control-room/control-room-scene.ts \
            src/app/features/control-room/control-room.page.ts \
            src/app/features/control-room/control-room.page.html
          for f in \
            src/app/features/control-room/control-room-scene.ts \
            src/app/features/control-room/control-room.page.ts \
            src/app/features/control-room/control-room.page.html; do
            echo "__MAZMI_FORMAT_BEGIN__:$f"
            base64 "$f"
            echo "__MAZMI_FORMAT_END__:$f"
          done
