name: Temporary UI formatting
on:
  push:
    paths:
      - '.github/workflows/temporary-format-ui.yml'
permissions:
  contents: write
jobs:
  format-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install formatter from locked project dependencies
        run: npm ci --prefix frontend
      - name: Format changed UI files
        run: |
          cd frontend
          npx prettier --write             src/app/core/layout/shell.component.ts             src/app/shared/components/icon.component.ts             src/app/shared/components/silk-aurora.component.ts             src/app/shared/components/operational-circuit.component.ts             src/app/shared/components/page-header.component.ts             src/app/core/auth/login.page.ts             src/styles.scss
          cd ..
          npx --prefix frontend prettier --write .github/scripts/capture-demo.cjs
      - name: Commit formatted UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend .github/scripts/capture-demo.cjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format MAZMI monochrome navigation"
            git push origin HEAD:main
          fi
