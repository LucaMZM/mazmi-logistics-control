name: Temporary UI final formatter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-ui-final-formatter.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Apply exact repository Prettier configuration
        run: |
          cd frontend
          ./node_modules/.bin/prettier --write src/styles.scss src/app/shared/components/page-header.component.ts src/app/shared/components/page-header.component.spec.ts
      - name: Export formatted files
        run: |
          for f in frontend/src/styles.scss frontend/src/app/shared/components/page-header.component.ts frontend/src/app/shared/components/page-header.component.spec.ts; do
            echo "__MAZMI_FORMAT_BEGIN__:$f"
            base64 "$f"
            echo "__MAZMI_FORMAT_END__:$f"
          done
