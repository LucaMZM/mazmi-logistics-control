name: Temporary MAZMI Glass formatter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-ui-formatter.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend --no-audit --no-fund
      - name: Format SCSS with repo Prettier
        run: ./frontend/node_modules/.bin/prettier --write frontend/src/styles.scss
      - name: Output formatted SCSS
        run: |
          echo __MAZMI_SCSS_BEGIN__
          base64 frontend/src/styles.scss
          echo __MAZMI_SCSS_END__
