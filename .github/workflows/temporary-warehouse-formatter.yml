name: Warehouse Editor formatter (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-warehouse-formatter.yml'

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply official Java formatter
        run: cd backend && ./mvnw spotless:apply
      - name: Export formatted Java sources
        shell: bash
        run: |
          for f in \
            backend/src/main/java/com/mazmi/logistics/warehouses/WarehouseLayoutController.java \
            backend/src/test/java/com/mazmi/logistics/warehouses/WarehouseLayoutControllerTest.java \
            backend/src/test/java/com/mazmi/logistics/warehouses/WarehouseLayoutPersistenceTest.java; do
            echo "__MAZMI_FORMAT_BEGIN__:$f"
            base64 "$f"
            echo "__MAZMI_FORMAT_END__:$f"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Apply official frontend formatter
        run: |
          cd frontend
          ./node_modules/.bin/prettier --write \
            src/app/features/warehouse-editor/warehouse-layout.model.ts \
            src/app/features/warehouse-editor/warehouse-layout.model.spec.ts \
            src/app/features/warehouse-editor/warehouse-editor-scene-loader.ts \
            src/app/features/warehouse-editor/warehouse-editor-scene.ts \
            src/app/features/warehouse-editor/warehouse-editor.page.ts \
            src/app/features/warehouse-editor/warehouse-editor.page.html \
            src/app/features/warehouse-editor/warehouse-editor.page.scss \
            src/app/features/warehouse-editor/warehouse-editor.page.spec.ts \
            src/app/core/services/api.service.ts \
            src/app/app.routes.ts \
            src/app/core/layout/shell.component.ts \
            src/app/features/warehouse-twin/warehouse-twin.page.ts
      - name: Export formatted TypeScript and templates
        shell: bash
        run: |
          for f in \
            frontend/src/app/features/warehouse-editor/warehouse-layout.model.ts \
            frontend/src/app/features/warehouse-editor/warehouse-layout.model.spec.ts \
            frontend/src/app/features/warehouse-editor/warehouse-editor-scene-loader.ts \
            frontend/src/app/features/warehouse-editor/warehouse-editor-scene.ts \
            frontend/src/app/features/warehouse-editor/warehouse-editor.page.ts \
            frontend/src/app/features/warehouse-editor/warehouse-editor.page.html \
            frontend/src/app/features/warehouse-editor/warehouse-editor.page.scss \
            frontend/src/app/features/warehouse-editor/warehouse-editor.page.spec.ts \
            frontend/src/app/core/services/api.service.ts \
            frontend/src/app/app.routes.ts \
            frontend/src/app/core/layout/shell.component.ts \
            frontend/src/app/features/warehouse-twin/warehouse-twin.page.ts; do
            echo "__MAZMI_FORMAT_BEGIN__:$f"
            base64 "$f"
            echo "__MAZMI_FORMAT_END__:$f"
          done
